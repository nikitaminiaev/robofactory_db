# docker-compose для AppImage-сборки RoboFactory DB.
#
# Отличия от dev-версии docker-compose.yaml:
#   - имена контейнеров rf-app-db / rf-app-api (не конфликтуют с dev-стеком db / api)
#   - пути томов с данными берутся из RF_DATA_DIR (задаёт AppRun: ~/.local/share/robofactory-db/data)
#   - порты настраиваются через RF_API_PORT / RF_DB_PORT / RF_WS_PORT в .env
#   - uvicorn без --reload, api ждёт готовности postgres (healthcheck)

name: robofactory-app

services:
  db:
    container_name: rf-app-db
    ports:
      - "${RF_DB_PORT:-5433}:5432"
    environment:
      - POSTGRES_PASSWORD=root
      - POSTGRES_USER=admin
      - PGHOST=db
    image: postgres:16-alpine
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U admin"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 10s
    volumes:
      - ${RF_DATA_DIR}/storage:/var/lib/postgresql/data:rw

  api:
    container_name: rf-app-api
    ports:
      - "${RF_API_PORT:-8000}:8000"
      - "${RF_WS_PORT:-8765}:8765"
    build:
      context: ./docker/api
      dockerfile: ./Dockerfile
    volumes:
      - .:/usr/src
      - ${RF_DATA_DIR}/resources:/usr/src/api/resources
    env_file:
      - .env
    environment:
      - PYTHONPATH=/usr/src
      # контейнер пишет от root, а том .:/usr/src — домашний каталог пользователя;
      # без этого __pycache__ от root блокирует обновление кода приложением
      - PYTHONDONTWRITEBYTECODE=1
    extra_hosts:
      - "host.docker.internal:host-gateway"
    command: sh -c "uvicorn main:app --host 0.0.0.0 --port 8000"
    depends_on:
      db:
        condition: service_healthy
    tty: true
