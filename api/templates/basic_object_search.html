<!-- templates/search.html -->
{% extends "base.html" %}

{% block title %}Search Modules{% endblock %}

{% block content %}
<h1>Search Modules</h1>
<form id="searchForm">
    <label for="name">Object Name:</label>
    <input type="text" id="name" name="name" required>
    <button type="submit">Search</button>
</form>

<div id="result"></div>

<script>
$(document).ready(function() {
    $('#searchForm').submit(function(e) {
        e.preventDefault();
        var name = $('#name').val();
        $.getJSON('/api/basic_object?name=' + encodeURIComponent(name), function(data) {
            var resultHtml = '';
            if (data.error_message) {
                resultHtml = '<div class="error-message">' + data.error_message + '</div>';
            } else if (data) {
                resultHtml = '<h2>Search Result:</h2>' + renderObjectDetails(data);
            }
            $('#result').html(resultHtml);
            
            // Обновляем видимость кнопок FreeCad после загрузки результатов
            if (typeof updateFreeCadButtonsVisibility === 'function') {
                updateFreeCadButtonsVisibility();
            }
        });
    });
});
</script>

<!-- Подключаем скрипты для работы с FreeCad -->
<script src="/static/js/object-details.js"></script>
<script src="/static/js/freecad-integration.js"></script>
{% endblock %}
