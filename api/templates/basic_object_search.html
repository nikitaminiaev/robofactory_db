<!-- templates/search.html -->
{% extends "base.html" %}

{% block title %}Search Modules{% endblock %}

{% block content %}
<h1>Search Modules</h1>
<form id="searchForm" class="search-form-grid">
    <div class="form-group">
        <label for="name">Object Name:</label>
        <input type="text" id="name" name="name" placeholder="Search by name...">
    </div>
    <div class="form-group">
        <label for="author">Author:</label>
        <input type="text" id="author" name="author" placeholder="Search by author...">
    </div>
    <div class="form-group">
        <label for="created_ts">Created Since:</label>
        <input type="date" id="created_ts" name="created_ts">
    </div>
    <div class="form-actions">
        <button type="submit">Search</button>
    </div>
</form>

<div id="result"></div>

<script>
$(document).ready(function() {
    // Изменение цвета даты при выборе
    function updateDateColor(el) {
        if (el.value) {
            $(el).css('color', '#333');
        } else {
            $(el).css('color', '#999');
        }
    }
    
    $('#created_ts').on('input change', function() {
        updateDateColor(this);
    });
    
    // Инициализация при загрузке
    updateDateColor(document.getElementById('created_ts'));

    $('#searchForm').submit(function(e) {
        e.preventDefault();
        var name = $('#name').val();
        var author = $('#author').val();
        var created_ts = $('#created_ts').val();
        
        var queryParams = [];
        if (name) queryParams.push('name=' + encodeURIComponent(name));
        if (author) queryParams.push('author=' + encodeURIComponent(author));
        if (created_ts) queryParams.push('created_ts=' + encodeURIComponent(created_ts));
        
        if (queryParams.length === 0) {
            alert('Пожалуйста, заполните хотя бы одно поле для поиска');
            return;
        }
        
        var url = '/api/basic_object?' + queryParams.join('&');
        
        $.getJSON(url, function(data) {
            var resultHtml = '';
            if (data.error_message) {
                resultHtml = '<div class="error-message">' + data.error_message + '</div>';
            } else if (data && data.length > 0) {
                resultHtml = '<h2>Search Results:</h2>' + renderModulesTable(data);
            } else {
                resultHtml = '<div class="info-message">Объекты по заданным критериям не найдены</div>';
            }
            $('#result').html(resultHtml);
            
            // Обновляем видимость кнопок FreeCad после загрузки результатов
            if (typeof updateFreeCadButtonsVisibility === 'function') {
                updateFreeCadButtonsVisibility();
            }
        });
    });
});
</script>

{% endblock %}
