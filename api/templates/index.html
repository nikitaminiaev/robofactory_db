<!-- templates/index.html -->
{% extends "base.html" %}

{% block title %}Welcome{% endblock %}

{% block extra_head %}
<style>
    .page-actions {
        margin: 24px 0;
        display: flex;
        gap: 12px;
        align-items: center;
    }

    .btn-primary {
        background: #3498db;
        color: white;
        border: none;
        padding: 10px 20px;
        border-radius: 6px;
        font-size: 14px;
        font-weight: 500;
        cursor: pointer;
        transition: background 0.2s;
    }

    .btn-primary:hover {
        background: #2980b9;
    }

    .btn-secondary {
        background: white;
        color: #555;
        border: 1px solid #ddd;
        padding: 10px 20px;
        border-radius: 6px;
        font-size: 14px;
        font-weight: 500;
        cursor: pointer;
        transition: background 0.2s, border-color 0.2s;
    }

    .btn-secondary:hover {
        background: #f5f5f5;
        border-color: #bbb;
    }

    /* Modal */
    .modal-overlay {
        display: none;
        position: fixed;
        inset: 0;
        background: rgba(0, 0, 0, 0.45);
        z-index: 1000;
        align-items: center;
        justify-content: center;
    }

    .modal-overlay.active {
        display: flex;
    }

    .modal {
        display: flex;
        flex-direction: column;
        background: white;
        border-radius: 10px;
        box-shadow: 0 8px 32px rgba(0, 0, 0, 0.18);
        width: 100%;
        max-width: 480px;
        overflow: hidden;
    }

    .modal-header {
        flex-shrink: 0;
        padding: 14px 20px;
        background: #f0f4f8;
        border-bottom: 1px solid #dde3ea;
    }

    .modal-title {
        font-size: 14px;
        font-weight: 600;
        color: #2c3e50;
        margin: 0;
        letter-spacing: 0.01em;
    }

    .modal-body {
        padding: 28px 28px 0;
    }

    .modal-footer {
        padding: 0 28px 24px;
    }

    .form-group {
        margin-bottom: 18px;
    }

    .form-group label {
        display: block;
        font-size: 13px;
        font-weight: 500;
        color: #444;
        margin-bottom: 6px;
    }

    .form-group label .required {
        color: #e74c3c;
        margin-left: 2px;
    }

    .form-group input[type="text"],
    .form-group textarea {
        width: 100%;
        border: 1px solid #ddd;
        border-radius: 6px;
        padding: 9px 12px;
        font-size: 14px;
        color: #333;
        box-sizing: border-box;
        transition: border-color 0.2s;
        font-family: inherit;
    }

    .form-group input[type="text"]:focus,
    .form-group textarea:focus {
        outline: none;
        border-color: #3498db;
        box-shadow: 0 0 0 3px rgba(52, 152, 219, 0.12);
    }

    .form-group textarea {
        resize: vertical;
        min-height: 80px;
    }

    .form-group .hint {
        font-size: 12px;
        color: #999;
        margin-top: 4px;
    }

    .checkbox-group {
        display: flex;
        gap: 24px;
        margin-top: 4px;
    }

    .checkbox-label {
        display: flex;
        align-items: center;
        gap: 8px;
        font-size: 14px;
        color: #444;
        cursor: pointer;
        user-select: none;
    }

    .checkbox-label input[type="checkbox"] {
        width: 16px;
        height: 16px;
        cursor: pointer;
        accent-color: #3498db;
    }

    .modal-footer {
        display: flex;
        justify-content: flex-end;
        gap: 10px;
        margin-top: 24px;
        padding-top: 16px;
        border-top: 1px solid #eee;
    }

    .file-drop-area {
        border: 2px dashed #c8d6e5;
        border-radius: 6px;
        padding: 16px;
        text-align: center;
        cursor: pointer;
        transition: border-color 0.2s, background 0.2s;
        position: relative;
    }

    .file-drop-area:hover,
    .file-drop-area.drag-over {
        border-color: #3498db;
        background: #f0f8ff;
    }

    .file-drop-area input[type="file"] {
        position: absolute;
        inset: 0;
        opacity: 0;
        cursor: pointer;
        width: 100%;
        height: 100%;
    }

    .file-drop-label {
        font-size: 13px;
        color: #888;
        pointer-events: none;
    }

    .file-drop-label span {
        color: #3498db;
        font-weight: 500;
    }

    .file-list {
        margin-top: 8px;
        display: flex;
        flex-wrap: wrap;
        gap: 6px;
    }

    .file-tag {
        display: inline-flex;
        align-items: center;
        gap: 4px;
        background: #eaf4fd;
        color: #2471a3;
        border: 1px solid #aed6f1;
        border-radius: 4px;
        padding: 3px 8px;
        font-size: 12px;
    }

    .error-message {
        color: #e74c3c;
        font-size: 13px;
        margin-top: 12px;
        display: none;
    }

    .success-message {
        color: #27ae60;
        font-size: 13px;
        margin-top: 12px;
        display: none;
    }
</style>
{% endblock %}

{% block content %}
<h1>Welcome to the PLM</h1>

<div class="page-actions">
    <button class="btn-primary" id="openCreateModal">+ New Module</button>
    <a href="/basic_object" class="btn-secondary">Search Modules</a>
</div>

<!-- Modal -->
<div class="modal-overlay" id="createModuleOverlay">
    <div class="modal">
        <div class="modal-header">
            <h2 class="modal-title">New Module</h2>
        </div>

        <form id="createModuleForm" novalidate>
            <div class="modal-body">
                <div class="form-group">
                    <label for="moduleName">Name <span class="required">*</span></label>
                    <input type="text" id="moduleName" name="name" placeholder="Enter module name" autocomplete="off">
                </div>

                <div class="form-group">
                    <label for="moduleAuthor">Author</label>
                    <input type="text" id="moduleAuthor" name="author" placeholder="Author name (optional)" autocomplete="off">
                </div>

                <div class="form-group">
                    <label for="moduleDescription">Description</label>
                    <textarea id="moduleDescription" name="description" placeholder="Brief module description (optional)"></textarea>
                </div>

                <div class="form-group">
                    <label>Contour type</label>
                    <div class="checkbox-group">
                        <label class="checkbox-label">
                            <input type="checkbox" id="isAssembly" name="is_assembly">
                            Assembly
                        </label>
                        <label class="checkbox-label">
                            <input type="checkbox" id="isShell" name="is_shell">
                            Shell
                        </label>
                    </div>
                    <div class="hint">Check if the module is an assembly or shell</div>
                </div>

                <div class="form-group">
                    <label>Files <span style="font-weight:400;color:#999">(optional — .brep, .stl, .scad)</span></label>
                    <div class="file-drop-area" id="fileDropArea">
                        <input type="file" id="moduleFiles" name="files" multiple accept=".brep,.stl,.scad">
                        <div class="file-drop-label">
                            <span>Click to select</span> or drag files here
                        </div>
                    </div>
                    <div class="file-list" id="fileList"></div>
                </div>

                <div class="error-message" id="formError"></div>
                <div class="success-message" id="formSuccess"></div>
            </div>

            <div class="modal-footer">
                <button type="button" class="btn-secondary" id="cancelCreate">Cancel</button>
                <button type="submit" class="btn-primary" id="submitCreate">Create</button>
            </div>
        </form>
    </div>
</div>

<script>
    const overlay = document.getElementById('createModuleOverlay');
    const form = document.getElementById('createModuleForm');
    const errorEl = document.getElementById('formError');
    const successEl = document.getElementById('formSuccess');
    const submitBtn = document.getElementById('submitCreate');
    const fileInput = document.getElementById('moduleFiles');
    const fileList = document.getElementById('fileList');
    const dropArea = document.getElementById('fileDropArea');

    function openModal() {
        overlay.classList.add('active');
        document.getElementById('moduleName').focus();
    }

    function closeModal() {
        overlay.classList.remove('active');
        form.reset();
        fileList.innerHTML = '';
        errorEl.style.display = 'none';
        successEl.style.display = 'none';
        submitBtn.disabled = false;
        submitBtn.textContent = 'Create';
    }

    function renderFileList(files) {
        fileList.innerHTML = '';
        Array.from(files).forEach(function (f) {
            const tag = document.createElement('span');
            tag.className = 'file-tag';
            tag.textContent = f.name;
            fileList.appendChild(tag);
        });
    }

    fileInput.addEventListener('change', function () {
        renderFileList(this.files);
    });

    dropArea.addEventListener('dragover', function (e) {
        e.preventDefault();
        dropArea.classList.add('drag-over');
    });

    dropArea.addEventListener('dragleave', function () {
        dropArea.classList.remove('drag-over');
    });

    dropArea.addEventListener('drop', function (e) {
        e.preventDefault();
        dropArea.classList.remove('drag-over');
        const dt = new DataTransfer();
        Array.from(e.dataTransfer.files).forEach(function (f) { dt.items.add(f); });
        fileInput.files = dt.files;
        renderFileList(fileInput.files);
    });

    document.getElementById('openCreateModal').addEventListener('click', openModal);
    document.getElementById('cancelCreate').addEventListener('click', closeModal);

    overlay.addEventListener('click', function (e) {
        if (e.target === overlay) closeModal();
    });

    document.addEventListener('keydown', function (e) {
        if (e.key === 'Escape') closeModal();
    });

    form.addEventListener('submit', async function (e) {
        e.preventDefault();
        errorEl.style.display = 'none';
        successEl.style.display = 'none';

        const name = document.getElementById('moduleName').value.trim();
        if (!name) {
            errorEl.textContent = 'Module name is required.';
            errorEl.style.display = 'block';
            document.getElementById('moduleName').focus();
            return;
        }

        const formData = new FormData();
        formData.append('name', name);

        const author = document.getElementById('moduleAuthor').value.trim();
        if (author) formData.append('author', author);

        const description = document.getElementById('moduleDescription').value.trim();
        if (description) formData.append('description', description);

        formData.append('is_assembly', document.getElementById('isAssembly').checked);
        formData.append('is_shell', document.getElementById('isShell').checked);

        Array.from(fileInput.files).forEach(function (f) {
            formData.append('files', f, f.name);
        });

        submitBtn.disabled = true;
        submitBtn.textContent = 'Creating...';

        try {
            const response = await fetch('/api/basic_object/form', {
                method: 'POST',
                body: formData,
            });

            const data = await response.json();

            if (!response.ok) {
                errorEl.textContent = data.detail || 'Failed to create module.';
                errorEl.style.display = 'block';
                submitBtn.disabled = false;
                submitBtn.textContent = 'Create';
                return;
            }

            successEl.textContent = `Module created. ID: ${data.id}`;
            successEl.style.display = 'block';

            setTimeout(function () {
                window.location.href = `/basic_object/${data.id}`;
            }, 1200);

        } catch (err) {
            errorEl.textContent = 'Network error. Please check your connection.';
            errorEl.style.display = 'block';
            submitBtn.disabled = false;
            submitBtn.textContent = 'Create';
        }
    });
</script>
{% endblock %}
