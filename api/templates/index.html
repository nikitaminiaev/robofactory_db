<!-- templates/index.html -->
{% extends "base.html" %}

{% block title %}Welcome{% endblock %}

{% block extra_head %}
<style>
    .page-actions {
        margin: 24px 0;
        display: flex;
        gap: 12px;
        align-items: center;
    }

    .btn-primary {
        background: #3498db;
        color: white;
        border: none;
        padding: 10px 20px;
        border-radius: 6px;
        font-size: 14px;
        font-weight: 500;
        cursor: pointer;
        transition: background 0.2s;
    }

    .btn-primary:hover {
        background: #2980b9;
    }

    .btn-secondary {
        background: white;
        color: #555;
        border: 1px solid #ddd;
        padding: 10px 20px;
        border-radius: 6px;
        font-size: 14px;
        font-weight: 500;
        cursor: pointer;
        transition: background 0.2s, border-color 0.2s;
    }

    .btn-secondary:hover {
        background: #f5f5f5;
        border-color: #bbb;
    }

    /* Modal */
    .modal-overlay {
        display: none;
        position: fixed;
        inset: 0;
        background: rgba(0, 0, 0, 0.45);
        z-index: 1000;
        align-items: center;
        justify-content: center;
    }

    .modal-overlay.active {
        display: flex;
    }

    .modal {
        display: flex;
        flex-direction: column;
        background: white;
        border-radius: 10px;
        box-shadow: 0 8px 32px rgba(0, 0, 0, 0.18);
        width: 100%;
        max-width: 480px;
        overflow: hidden;
    }

    .modal-header {
        display: flex;
        flex-shrink: 0;
        align-items: center;
        justify-content: space-between;
        padding: 16px 20px;
        background: #2c3e50;
    }

    .modal-title {
        font-size: 15px;
        font-weight: 600;
        color: white;
        margin: 0;
        letter-spacing: 0.01em;
    }

    .modal-close {
        background: none;
        border: none;
        font-size: 20px;
        color: rgba(255, 255, 255, 0.7);
        cursor: pointer;
        line-height: 1;
        padding: 2px 4px;
        border-radius: 4px;
        transition: color 0.15s, background 0.15s;
    }

    .modal-close:hover {
        color: white;
        background: rgba(255, 255, 255, 0.12);
    }

    .modal-body {
        padding: 28px 28px 0;
    }

    .modal-footer {
        padding: 0 28px 24px;
    }

    .form-group {
        margin-bottom: 18px;
    }

    .form-group label {
        display: block;
        font-size: 13px;
        font-weight: 500;
        color: #444;
        margin-bottom: 6px;
    }

    .form-group label .required {
        color: #e74c3c;
        margin-left: 2px;
    }

    .form-group input[type="text"],
    .form-group textarea {
        width: 100%;
        border: 1px solid #ddd;
        border-radius: 6px;
        padding: 9px 12px;
        font-size: 14px;
        color: #333;
        box-sizing: border-box;
        transition: border-color 0.2s;
        font-family: inherit;
    }

    .form-group input[type="text"]:focus,
    .form-group textarea:focus {
        outline: none;
        border-color: #3498db;
        box-shadow: 0 0 0 3px rgba(52, 152, 219, 0.12);
    }

    .form-group textarea {
        resize: vertical;
        min-height: 80px;
    }

    .form-group .hint {
        font-size: 12px;
        color: #999;
        margin-top: 4px;
    }

    .checkbox-group {
        display: flex;
        gap: 24px;
        margin-top: 4px;
    }

    .checkbox-label {
        display: flex;
        align-items: center;
        gap: 8px;
        font-size: 14px;
        color: #444;
        cursor: pointer;
        user-select: none;
    }

    .checkbox-label input[type="checkbox"] {
        width: 16px;
        height: 16px;
        cursor: pointer;
        accent-color: #3498db;
    }

    .modal-footer {
        display: flex;
        justify-content: flex-end;
        gap: 10px;
        margin-top: 24px;
        padding-top: 16px;
        border-top: 1px solid #eee;
    }

    .error-message {
        color: #e74c3c;
        font-size: 13px;
        margin-top: 12px;
        display: none;
    }

    .success-message {
        color: #27ae60;
        font-size: 13px;
        margin-top: 12px;
        display: none;
    }
</style>
{% endblock %}

{% block content %}
<h1>Welcome to the Module API</h1>

<div class="page-actions">
    <button class="btn-primary" id="openCreateModal">+ New Module</button>
    <a href="/basic_object" class="btn-secondary">Search Modules</a>
</div>

<!-- Modal -->
<div class="modal-overlay" id="createModuleOverlay">
    <div class="modal">
        <div class="modal-header">
            <h2 class="modal-title">New Module</h2>
            <button class="modal-close" id="closeModal" title="Close">&times;</button>
        </div>

        <form id="createModuleForm" novalidate>
            <div class="modal-body">
                <div class="form-group">
                    <label for="moduleName">Name <span class="required">*</span></label>
                    <input type="text" id="moduleName" name="name" placeholder="Enter module name" autocomplete="off">
                </div>

                <div class="form-group">
                    <label for="moduleAuthor">Author</label>
                    <input type="text" id="moduleAuthor" name="author" placeholder="Author name (optional)" autocomplete="off">
                </div>

                <div class="form-group">
                    <label for="moduleDescription">Description</label>
                    <textarea id="moduleDescription" name="description" placeholder="Brief module description (optional)"></textarea>
                </div>

                <div class="form-group">
                    <label>Contour type</label>
                    <div class="checkbox-group">
                        <label class="checkbox-label">
                            <input type="checkbox" id="isAssembly" name="is_assembly">
                            Assembly
                        </label>
                        <label class="checkbox-label">
                            <input type="checkbox" id="isShell" name="is_shell">
                            Shell
                        </label>
                    </div>
                    <div class="hint">Check if the module is an assembly or shell</div>
                </div>

                <div class="error-message" id="formError"></div>
                <div class="success-message" id="formSuccess"></div>
            </div>

            <div class="modal-footer">
                <button type="button" class="btn-secondary" id="cancelCreate">Cancel</button>
                <button type="submit" class="btn-primary" id="submitCreate">Create</button>
            </div>
        </form>
    </div>
</div>

<script>
    const overlay = document.getElementById('createModuleOverlay');
    const form = document.getElementById('createModuleForm');
    const errorEl = document.getElementById('formError');
    const successEl = document.getElementById('formSuccess');
    const submitBtn = document.getElementById('submitCreate');

    function openModal() {
        overlay.classList.add('active');
        document.getElementById('moduleName').focus();
    }

    function closeModal() {
        overlay.classList.remove('active');
        form.reset();
        errorEl.style.display = 'none';
        successEl.style.display = 'none';
        submitBtn.disabled = false;
        submitBtn.textContent = 'Create';
    }

    document.getElementById('openCreateModal').addEventListener('click', openModal);
    document.getElementById('closeModal').addEventListener('click', closeModal);
    document.getElementById('cancelCreate').addEventListener('click', closeModal);

    overlay.addEventListener('click', function (e) {
        if (e.target === overlay) closeModal();
    });

    document.addEventListener('keydown', function (e) {
        if (e.key === 'Escape') closeModal();
    });

    form.addEventListener('submit', async function (e) {
        e.preventDefault();
        errorEl.style.display = 'none';
        successEl.style.display = 'none';

        const name = document.getElementById('moduleName').value.trim();
        if (!name) {
            errorEl.textContent = 'Module name is required.';
            errorEl.style.display = 'block';
            document.getElementById('moduleName').focus();
            return;
        }

        const author = document.getElementById('moduleAuthor').value.trim() || null;
        const description = document.getElementById('moduleDescription').value.trim() || null;
        const isAssembly = document.getElementById('isAssembly').checked;
        const isShell = document.getElementById('isShell').checked;

        submitBtn.disabled = true;
        submitBtn.textContent = 'Creating...';

        try {
            const response = await fetch('/api/basic_object/', {
                method: 'POST',
                headers: {'Content-Type': 'application/json'},
                body: JSON.stringify({
                    name,
                    author,
                    description,
                    is_assembly: isAssembly,
                    is_shell: isShell,
                })
            });

            const data = await response.json();

            if (!response.ok) {
                errorEl.textContent = data.detail || 'Failed to create module.';
                errorEl.style.display = 'block';
                submitBtn.disabled = false;
                submitBtn.textContent = 'Create';
                return;
            }

            successEl.textContent = `Module created. ID: ${data.id}`;
            successEl.style.display = 'block';
            submitBtn.textContent = 'Create another';
            submitBtn.disabled = false;

            setTimeout(() => {
                window.location.href = `/basic_object/${data.id}`;
            }, 1200);

        } catch (err) {
            errorEl.textContent = 'Network error. Please check your connection.';
            errorEl.style.display = 'block';
            submitBtn.disabled = false;
            submitBtn.textContent = 'Create';
        }
    });
</script>
{% endblock %}
