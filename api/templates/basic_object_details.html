<!-- templates/object_details.html -->
{% extends "base.html" %}

{% block title %}Module details{% endblock %}

{% block content %}
<h1>Module details</h1>
<div id="objectDetails"></div>

<script>
document.addEventListener('DOMContentLoaded', function() {
    const id = window.location.pathname.split('/').pop();

    fetch('/api/basic_object/' + id)
        .then(response => response.json())
        .then(data => {
            document.getElementById('objectDetails').innerHTML = renderObjectDetails(data);
            // Обновляем видимость кнопок FreeCad после загрузки деталей объекта
            if (typeof updateFreeCadButtonsVisibility === 'function') {
                updateFreeCadButtonsVisibility();
            }
        })
        .catch(error => {
            console.error('Error loading object details:', error);
            document.getElementById('objectDetails').innerHTML = `
                <div class="error-message">
                    Error loading object details. Please try again later.
                </div>`;
        });
});
</script>

<!-- Подключаем скрипты для работы с FreeCad -->
<script src="/static/js/object-details.js"></script>
<script src="/static/js/freecad-integration.js"></script>
{% endblock %}
