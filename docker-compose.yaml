services:
   db:
     container_name: db
     ports:
       - "5433:5432"
     environment:
       - POSTGRES_PASSWORD=root
       - POSTGRES_USER=admin
       - PGHOST=db
     image: postgres:16-alpine
     volumes:
       - ./db/dump:/home/db/dump
       - ./db/storage:/var/lib/postgresql/data:rw
   api:
     container_name: api
     ports:
       - 8000:8000
       - 8765:8765
     build:
       context: ./docker/api
       dockerfile: ./Dockerfile
     volumes:
       - .:/usr/src
       - ./docker/api/requirements.txt:/usr/src/docker/api/requirements.txt
     environment:
       - PYTHONPATH=/usr/src
     command: sh -c "uvicorn main:app --host 0.0.0.0 --reload"
     tty: true
